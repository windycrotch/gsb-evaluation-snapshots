<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 · please just text me</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #eef1f6; --fg: #111; --muted: #6e6e73; --accent: #0b84fe; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --fg: #f2f2f7; --muted: #a1a1a6; } }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 16px;
        background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, Roboto, sans-serif;
      }
      .bubble { display: inline-block; background: var(--accent); color: #fff; font-size: 22px; padding: 10px 18px; border-radius: 22px; }
      p { color: var(--muted); }
      a { color: var(--accent); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="bubble">404 — nothing here 🤷</div>
      <p>This page doesn’t exist. Not even as a voice message.</p>
      <a href="/">← pleasejusttext.me</a>
    </main>
  </body>
</html>
