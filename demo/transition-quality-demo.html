<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
    <head>
        <title>Demo (Transition × Quality × DisplayMode 协调验证)</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <link rel="icon" href="/favicon.ico" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
                font: 13px/1.5 system-ui, sans-serif;
                color: #eee;
            }
            #gsviewer {
                position: absolute;
                inset: 0;
            }
            #panel {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 10;
                width: 340px;
                max-height: calc(100% - 24px);
                overflow: auto;
                padding: 12px;
                border-radius: 8px;
                background: rgba(20, 22, 28, 0.88);
                backdrop-filter: blur(6px);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }
            #panel h3 {
                margin: 0 0 8px;
                font-size: 14px;
            }
            .row {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }
            button {
                flex: 1 1 auto;
                padding: 6px 8px;
                border: 1px solid #3a3f4b;
                border-radius: 5px;
                background: #232734;
                color: #ddd;
                cursor: pointer;
                font-size: 12px;
            }
            button:hover {
                background: #2f3545;
            }
            button.primary {
                background: #2b4a7a;
                border-color: #3d6aa8;
            }
            pre {
                margin: 6px 0 0;
                max-height: 230px;
                overflow: auto;
                padding: 8px;
                border-radius: 5px;
                background: #101218;
                font-size: 11px;
                white-space: pre-wrap;
            }
            .hint {
                color: #8a93a6;
                font-size: 11px;
                margin: 4px 0 8px;
            }
        </style>
    </head>
    <body>
        <div id="gsviewer"></div>

        <div id="panel">
            <h3>过渡 / 画质 / 显示模式 协调验证</h3>
            <div class="row">
                <button id="btn-zoom" class="primary">① 重播首帧过渡</button>
                <button id="btn-mode">② 切换显示模式</button>
            </div>
            <div class="row">
                <button id="btn-mode-burst">③ 快速连点切换 ×5</button>
                <button id="btn-quality-burst">④ 过渡中连切档位 ×4</button>
            </div>
            <div class="row">
                <button id="btn-level-down">画质 −1</button>
                <button id="btn-level-up">画质 +1</button>
            </div>
            <div class="row">
                <button id="btn-dispose">⑤ 销毁</button>
                <button id="btn-reset">⑥ 重建并重载</button>
            </div>
            <div class="row">
                <button id="btn-no-transition">⑦ 无过渡重载（直接稳定态）</button>
            </div>
            <div class="hint">
                验证要点：过渡中切档位后参数以新档位为准且不再被旧动画改写；快速连点只保留最后一次；销毁后无残留帧回调与纹理写入。
            </div>
            <pre id="log"></pre>
        </div>

        <script type="module">
            import '../src/reall3d/assets/style/style.less';
            import { PerspectiveCamera, Scene, WebGLRenderer, AmbientLight } from 'three';
            import { OrbitControls } from 'three/examples/jsm/Addons.js';
            import { SplatMesh } from '../src/reall3d/meshs/splatmesh/SplatMesh';
            import { SplatMeshCycleZoom, SplatMeshSwitchDisplayMode, GetSplatMaterial, GetOptions } from '../src/reall3d/events/EventConstants';

            const MODEL_URL = 'https://reall3d.com/demo-models/hornedlizard.v3.sog';
            const root = document.querySelector('#gsviewer');
            const logEl = document.querySelector('#log');
            const lines = [];
            function log(...args) {
                lines.push(`[${new Date().toISOString().slice(14, 23)}] ${args.join(' ')}`);
                if (lines.length > 200) lines.shift();
                logEl.textContent = lines.join('\n');
                logEl.scrollTop = logEl.scrollHeight;
            }

            const scene = new Scene();
            scene.add(new AmbientLight(0xffffff, 1.2));
            const camera = new PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
            camera.position.set(1.3, -1, -1.3);
            camera.up.set(0, -1, 0);
            const controls = new OrbitControls(camera, root);
            const renderer = new WebGLRenderer({ antialias: false, precision: 'highp' });
            renderer.setSize(innerWidth, innerHeight);
            root.appendChild(renderer.domElement);
            addEventListener('resize', () => {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            });

            let splatMesh = null;

            /** 读取当前着色器关键参数（经事件通道取得真实材质，不另起机制） */
            function readParams() {
                if (!splatMesh) return null;
                const material = splatMesh.fire(GetSplatMaterial);
                const u = material?.uniforms || {};
                return {
                    shDegree: u.shDegree?.value,
                    minPixelDiameter: u.minPixelDiameter?.value,
                    maxPixelDiameter: u.maxPixelDiameter?.value,
                    minAlpha: Number((u.minAlpha?.value ?? 0).toFixed(4)),
                    useSimilarExp: u.useSimilarExp?.value,
                    visibleRadius: Number((u.currentVisibleRadius?.value ?? 0).toFixed(4)),
                    lightRadius: Number((u.currentLightRadius?.value ?? 0).toFixed(4)),
                    pointMode: u.pointMode?.value,
                };
            }

            function createMesh(options = {}) {
                splatMesh = new SplatMesh({ renderer, scene, camera, controls, shDegree: 3, transitionEffect: 1, ...options });
                scene.add(splatMesh);
                splatMesh.addModel({ url: MODEL_URL });
                return splatMesh;
            }

            createMesh();
            animate();
            function animate() {
                splatMesh && renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }

            document.querySelector('#btn-zoom').onclick = () => {
                log('▶ 手动触发首帧过渡 SplatMeshCycleZoom', JSON.stringify(readParams()));
                splatMesh?.fire(SplatMeshCycleZoom);
            };
            document.querySelector('#btn-mode').onclick = () => {
                log('▶ 切换显示模式 SplatMeshSwitchDisplayMode');
                splatMesh?.fire(SplatMeshSwitchDisplayMode);
            };
            document.querySelector('#btn-mode-burst').onclick = () => {
                log('▶ 快速连续切换显示模式 ×5（应只保留最后一次）');
                for (let i = 0; i < 5; i++) splatMesh?.fire(SplatMeshSwitchDisplayMode);
            };
            document.querySelector('#btn-quality-burst').onclick = () => {
                if (!splatMesh) return;
                log('▶ 过渡进行中连续切档位（应被安全终止并以新档位收敛）');
                splatMesh.fire(SplatMeshCycleZoom);
                for (let i = 0; i < 4; i++) {
                    const level = (i % 9) + 1;
                    setTimeout(() => {
                        if (!splatMesh) return;
                        splatMesh.options({ qualityLevel: level });
                        log(`  档位 → ${level}`, JSON.stringify(readParams()));
                    }, 60 + 80 * i);
                }
            };
            document.querySelector('#btn-dispose').onclick = () => {
                log('▶ 销毁 SplatMesh');
                const mesh = splatMesh;
                splatMesh = null;
                mesh?.dispose();
                setTimeout(() => log('  销毁 1s 后：无材质可读，无残留帧回调/纹理写入'), 1000);
            };
            document.querySelector('#btn-reset').onclick = () => {
                log('▶ 重建 SplatMesh 并重载模型');
                splatMesh?.dispose();
                createMesh();
            };
            document.querySelector('#btn-no-transition').onclick = () => {
                log('▶ 关闭首帧过渡特效重载（小场景直接进入稳定态）');
                splatMesh?.dispose();
                createMesh({ disableTransitionEffectOnLoad: true });
            };
            document.querySelector('#btn-level-down').onclick = () => changeLevel(-1);
            document.querySelector('#btn-level-up').onclick = () => changeLevel(1);

            function changeLevel(delta) {
                if (!splatMesh) return;
                const opts = splatMesh.fire(GetOptions);
                const level = Math.max(1, Math.min(9, (opts.qualityLevel || 5) + delta));
                splatMesh.options({ qualityLevel: level });
                log(`▶ 画质档位 → ${level}`, JSON.stringify(readParams()));
            }

            // 周期采样：用于观察“旧动画是否还在写参数”
            setInterval(() => {
                const p = readParams();
                p && log(`  参数快照 ${JSON.stringify(p)}`);
            }, 1200);
        </script>
    </body>
</html>
