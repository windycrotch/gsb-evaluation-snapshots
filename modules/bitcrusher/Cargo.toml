[package]
name = "clawdio-bitcrusher"
version = "0.1.0"
authors = ["Ryosuke Hana"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
# console_error_panic_hook = { version = "0.1.6", optional = true }
# web-sys = { version = "0.3.77", features = ["console"] }

[dev-dependencies]
test-helpers = { path = "../test-helpers", features = ["viz"] }

# wasm-opt requires downloading binaryen from GitHub; skip it so the build
# works in restricted/offline environments. Optimization can be re-enabled
# in CI where the toolchain is pre-cached.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false