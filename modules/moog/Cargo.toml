[package]
name = "clawdio-moog"
version = "0.1.0"
authors = ["Ryosuke Hana"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
shared = { package = "clawdio-shared", path = "../shared" }
# console_error_panic_hook = { version = "0.1.6", optional = true }
# web-sys = { version = "0.3.77", features = ["console"] }

[dev-dependencies]
test-helpers = { path = "../test-helpers", features = ["viz"] }

[package.metadata.wasm-pack.profile.release]
# binaryen (wasm-opt) isn't available in offline/sandboxed builds;
# the toolchain emits an unoptimized but fully functional package.
wasm-opt = false