<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoxelWeave 纹理工坊</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1d232d;
    --panel-2: #242c38;
    --line: #333d4c;
    --text: #e6ebf2;
    --muted: #9aa7b8;
    --accent: #4ea1d3;
    --accent-2: #2a9d8f;
    --danger: #e06c5b;
    --ok: #7fbf7f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .layout {
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    gap: 18px;
    padding: 18px 22px;
    align-items: start;
  }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
  .field label .hint { color: var(--muted); font-size: 12px; }
  .field input[type="number"], .field input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
  }
  .field input.invalid { border-color: var(--danger); }
  .field .error { color: var(--danger); font-size: 12px; margin-top: 4px; min-height: 0; }

  .palette-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .palette-row { display: flex; align-items: center; gap: 8px; }
  .palette-row input[type="color"] {
    width: 38px; height: 32px; padding: 0;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; cursor: pointer;
  }
  .palette-row input[type="text"] {
    flex: 1; min-width: 0;
    padding: 7px 9px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    font-family: ui-monospace, Consolas, monospace;
  }
  .palette-row .idx {
    width: 20px; text-align: center; color: var(--muted);
    font-family: ui-monospace, Consolas, monospace;
  }
  .palette-row button {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 7px;
    padding: 6px 9px;
    cursor: pointer;
  }
  .palette-row button:hover { color: var(--danger); border-color: var(--danger); }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.ghost {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 11px;
    cursor: pointer;
    font-size: 13px;
  }
  button.ghost:hover { border-color: var(--accent); }

  .preview-wrap { position: relative; }
  .canvas-box {
    background:
      repeating-conic-gradient(#2a323d 0% 25%, #232a34 0% 50%) 0 0 / 24px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 18px;
  }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; height: auto; }
  .placeholder { color: var(--muted); text-align: center; max-width: 420px; }
  .placeholder .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }
  .statusbar {
    display: flex; gap: 14px; flex-wrap: wrap;
    margin: 12px 2px 0; font-size: 12.5px; color: var(--muted);
  }
  .statusbar b { color: var(--text); font-weight: 600; }
  .export-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button.primary {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #0d141b;
    font-weight: 600;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    font-size: 14px;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.primary.teal { background: var(--accent-2); border-color: var(--accent-2); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .badge-ok { color: var(--ok); }
  .badge-err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>🧵 VoxelWeave 纹理工坊</h1>
  <span class="sub">纯静态页面 · 同种子同参数逐像素复现 · 所有计算均在本机浏览器完成</span>
</header>

<div class="layout">
  <!-- 左侧：参数与调色板 -->
  <section class="panel" aria-label="参数设置">
    <h2>织纹参数</h2>

    <div class="field">
      <label for="rows">行数 <span class="hint">整数 1–64</span></label>
      <input id="rows" type="number" min="1" max="64" step="1" value="3">
      <div class="error" id="err-rows"></div>
    </div>

    <div class="field">
      <label for="columns">列数 <span class="hint">整数 1–64</span></label>
      <input id="columns" type="number" min="1" max="64" step="1" value="4">
      <div class="error" id="err-columns"></div>
    </div>

    <div class="field">
      <label for="cellSize">单元格像素 <span class="hint">整数 4–32</span></label>
      <input id="cellSize" type="number" min="4" max="32" step="1" value="8">
      <div class="error" id="err-cellSize"></div>
    </div>

    <div class="field">
      <label for="seed">种子 <span class="hint">任意非空字符串</span></label>
      <input id="seed" type="text" value="sample-3x4-4c">
      <div class="error" id="err-seed"></div>
    </div>

    <h2 style="margin-top:18px">调色板（#RRGGBB）</h2>
    <div class="palette-list" id="paletteList"></div>
    <div class="row-actions">
      <button class="ghost" id="addColor" type="button">＋ 添加颜色</button>
      <button class="ghost" id="loadSample" type="button">载入本地样例参数</button>
    </div>
    <div class="error" id="err-palette"></div>
  </section>

  <!-- 右侧：实时预览与导出 -->
  <section class="preview-wrap">
    <div class="panel">
      <h2>织纹预览（实时）</h2>
      <div class="canvas-box" id="canvasBox">
        <canvas id="atlas" width="32" height="24" style="display:none"></canvas>
        <div class="placeholder" id="placeholder">
          <div class="big">暂无可显示的图集</div>
          <div id="placeholderText">修正左侧参数后将自动生成预览。</div>
        </div>
      </div>

      <div class="statusbar" id="statusbar">
        <span>状态：<b id="stateText">—</b></span>
        <span>图集尺寸：<b id="sizeText">—</b></span>
        <span>颜色覆盖：<b id="usageText">—</b></span>
      </div>

      <div class="export-bar">
        <button class="primary" id="exportPng" type="button" disabled>导出 PNG 图集</button>
        <button class="primary teal" id="exportJson" type="button" disabled>导出 JSON 配色清单</button>
        <button class="ghost" id="exportBoth" type="button" disabled>同时导出两份文件</button>
      </div>
      <div class="note">
        JSON 清单记录种子、行列、单元格尺寸、调色板颜色序列，以及每个格子（行优先）所用颜色的索引；
        索引与 PNG 实际像素逐格对应。相同种子与参数重新载入将得到完全相同的图集。
      </div>
    </div>
  </section>
</div>

<script src="weave-core.js"></script>
<script>
(function () {
  'use strict';

  var SAMPLE = {
    rows: 3, columns: 4, cellSize: 8,
    seed: 'sample-3x4-4c',
    palette: ['#264653', '#2a9d8f', '#e9c46a', '#e76f51']
  };
  var EXTRA_PRESET = ['#8ab17d', '#f4a261', '#e76f51', '#264653', '#2a9d8f', '#e9c46a', '#9b5de5', '#00bbf9'];

  var els = {
    rows: document.getElementById('rows'),
    columns: document.getElementById('columns'),
    cellSize: document.getElementById('cellSize'),
    seed: document.getElementById('seed'),
    paletteList: document.getElementById('paletteList'),
    addColor: document.getElementById('addColor'),
    loadSample: document.getElementById('loadSample'),
    canvas: document.getElementById('atlas'),
    placeholder: document.getElementById('placeholder'),
    placeholderText: document.getElementById('placeholderText'),
    stateText: document.getElementById('stateText'),
    sizeText: document.getElementById('sizeText'),
    usageText: document.getElementById('usageText'),
    exportPng: document.getElementById('exportPng'),
    exportJson: document.getElementById('exportJson'),
    exportBoth: document.getElementById('exportBoth')
  };
  var errEls = {
    rows: document.getElementById('err-rows'),
    columns: document.getElementById('err-columns'),
    cellSize: document.getElementById('err-cellSize'),
    seed: document.getElementById('err-seed'),
    palette: document.getElementById('err-palette')
  };

  // 上一次有效结果：非法输入时保留它，不清空预览
  var lastValid = null;
  var currentPalette = SAMPLE.palette.slice();

  function setFieldError(name, message) {
    errEls[name].textContent = message || '';
    var input = els[name];
    if (input) input.classList.toggle('invalid', Boolean(message));
  }

  function sanitizeFilename(s) {
    return String(s).replace(/[^a-zA-Z0-9._-]+/g, '_').slice(0, 60) || 'weave';
  }

  function download(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function baseName(r) {
    return 'voxelweave_' + sanitizeFilename(r.seed) + '_' + r.rows + 'x' + r.columns + '_' + r.cellSize + 'px';
  }

  /* ---------------- 调色板 UI ---------------- */

  function renderPaletteRows() {
    els.paletteList.innerHTML = '';
    currentPalette.forEach(function (color, i) {
      var row = document.createElement('div');
      row.className = 'palette-row';

      var idx = document.createElement('span');
      idx.className = 'idx';
      idx.textContent = i;

      var picker = document.createElement('input');
      picker.type = 'color';
      picker.value = /^#[0-9a-f]{6}$/i.test(color) ? color : '#000000';
      picker.setAttribute('aria-label', '颜色 ' + i + ' 取色器');
      picker.addEventListener('input', function () {
        text.value = picker.value;
        currentPalette[i] = picker.value;
        scheduleUpdate();
      });

      var text = document.createElement('input');
      text.type = 'text';
      text.value = color;
      text.spellcheck = false;
      text.setAttribute('aria-label', '颜色 ' + i + ' 十六进制值');
      text.addEventListener('input', function () {
        var v = text.value.trim();
        if (/^#[0-9a-f]{6}$/i.test(v)) {
          picker.value = v.toLowerCase();
          currentPalette[i] = v.toLowerCase();
          setFieldError('palette', '');
          scheduleUpdate();
        } else {
          setFieldError('palette', '颜色「' + v + '」不是合法的 #RRGGBB，已保留上一次有效预览。');
        }
      });

      var del = document.createElement('button');
      del.type = 'button';
      del.textContent = '删除';
      del.setAttribute('aria-label', '删除颜色 ' + i);
      del.addEventListener('click', function () {
        currentPalette.splice(i, 1);
        renderPaletteRows();
        scheduleUpdate();
      });

      row.appendChild(idx);
      row.appendChild(picker);
      row.appendChild(text);
      row.appendChild(del);
      els.paletteList.appendChild(row);
    });
  }

  els.addColor.addEventListener('click', function () {
    var next = EXTRA_PRESET[currentPalette.length % EXTRA_PRESET.length];
    currentPalette.push(next);
    renderPaletteRows();
    scheduleUpdate();
  });

  els.loadSample.addEventListener('click', function () {
    els.rows.value = SAMPLE.rows;
    els.columns.value = SAMPLE.columns;
    els.cellSize.value = SAMPLE.cellSize;
    els.seed.value = SAMPLE.seed;
    currentPalette = SAMPLE.palette.slice();
    renderPaletteRows();
    ['rows', 'columns', 'cellSize', 'seed', 'palette'].forEach(function (n) { setFieldError(n, ''); });
    update(true);
  });

  /* ---------------- 预览与状态 ---------------- */

  var pending = null;
  function scheduleUpdate() {
    if (pending) clearTimeout(pending);
    pending = setTimeout(function () { pending = null; update(false); }, 60);
  }

  function readParams() {
    return {
      rows: els.rows.value,
      columns: els.columns.value,
      cellSize: els.cellSize.value,
      seed: els.seed.value,
      palette: currentPalette.slice()
    };
  }

  function showValid(result) {
    lastValid = result;
    var w = result.columns * result.cellSize;
    var h = result.rows * result.cellSize;
    els.canvas.width = w;
    els.canvas.height = h;
    var ctx = els.canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, w, h);
    WeaveCore.renderToContext(ctx, result);

    els.canvas.style.display = 'block';
    els.placeholder.style.display = 'none';
    els.stateText.innerHTML = '<span class="badge-ok">有效预览</span>';
    els.sizeText.textContent = w + ' × ' + h + ' px';
    var manifest = WeaveCore.buildManifest(result);
    var covered = manifest.colorUsage.filter(function (n) { return n > 0; }).length;
    els.usageText.textContent = covered + ' / ' + result.palette.length + ' 种颜色已使用';

    [els.exportPng, els.exportJson, els.exportBoth].forEach(function (b) { b.disabled = false; });
  }

  function showInvalid(message, field) {
    // 保留上一次有效预览：画布不动，只更新提示
    if (lastValid) {
      els.placeholder.style.display = 'none';
      els.canvas.style.display = 'block';
      els.stateText.innerHTML = '<span class="badge-err">输入无效，显示的是上一次有效预览</span>';
    } else {
      els.canvas.style.display = 'none';
      els.placeholder.style.display = 'block';
      els.placeholderText.textContent = message;
      els.stateText.innerHTML = '<span class="badge-err">暂无可显示的图集</span>';
      els.sizeText.textContent = '—';
      els.usageText.textContent = '—';
      [els.exportPng, els.exportJson, els.exportBoth].forEach(function (b) { b.disabled = true; });
    }
    if (field) setFieldError(field, message);
  }

  function update(force) {
    ['rows', 'columns', 'cellSize', 'seed'].forEach(function (n) { setFieldError(n, ''); });
    if (!force) setFieldError('palette', '');

    var params = readParams();
    var result = WeaveCore.evaluate(params);

    if (result.ok) {
      setFieldError('palette', '');
      showValid(result);
      return;
    }

    // 把错误归到对应字段；结构性错误（可行性/调色板）显示在调色板区域与状态条
    var msg = result.error;
    var field = 'palette';
    if (msg.indexOf('行数') === 0) field = 'rows';
    else if (msg.indexOf('列数') === 0) field = 'columns';
    else if (msg.indexOf('单元格像素') === 0) field = 'cellSize';
    else if (msg.indexOf('种子') === 0) field = 'seed';
    setFieldError(field, msg);
    showInvalid(msg, field);
  }

  /* ---------------- 导出 ---------------- */

  function exportPNG(result) {
    var callback = function (blob) {
      if (!blob) {
        // 极端环境不支持 toBlob 时的兜底：dataURL
        var a = document.createElement('a');
        a.href = els.canvas.toDataURL('image/png');
        a.download = baseName(result) + '.png';
        a.click();
        return;
      }
      download(blob, baseName(result) + '.png');
    };
    els.canvas.toBlob(callback, 'image/png');
  }

  function exportJSON(result) {
    var manifest = WeaveCore.buildManifest(result);
    var blob = new Blob([JSON.stringify(manifest, null, 2) + '\n'], { type: 'application/json' });
    download(blob, baseName(result) + '.json');
  }

  els.exportPng.addEventListener('click', function () { if (lastValid) exportPNG(lastValid); });
  els.exportJson.addEventListener('click', function () { if (lastValid) exportJSON(lastValid); });
  els.exportBoth.addEventListener('click', function () {
    if (!lastValid) return;
    exportJSON(lastValid);
    setTimeout(function () { exportPNG(lastValid); }, 150);
  });

  ['rows', 'columns', 'cellSize', 'seed'].forEach(function (name) {
    els[name].addEventListener('input', scheduleUpdate);
  });

  /* ---------------- 初始化 ---------------- */
  renderPaletteRows();
  update(true);
})();
</script>
</body>
</html>
