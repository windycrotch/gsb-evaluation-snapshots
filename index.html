<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fretsense — 实时吉他弦品识别</title>
<style>
  :root {
    --bg: #0f1318;
    --panel: #181f27;
    --panel-2: #1f2832;
    --text: #e6ebf1;
    --muted: #93a1b0;
    --accent: #58a6ff;
    --good: #4ac97a;
    --bad: #eb6363;
    --warn: #f0c860;
    --border: #2a3642;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 70% -10%, #1a2531 0%, var(--bg) 60%);
    color: var(--text);
    font: 14px/1.5 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 20px 24px 8px; }
  header h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .5px; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 12px 24px 40px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-top: 16px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); }
  select, button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
  }
  button { cursor: pointer; }
  button#startStop {
    background: var(--accent);
    border-color: var(--accent);
    color: #08131f;
    font-weight: 700;
    min-width: 96px;
  }
  button#startStop.running { background: var(--bad); border-color: var(--bad); color: #1a0c0c; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .banner { border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-size: 13px; }
  .banner.hidden { display: none; }
  .banner.error { background: rgba(235,99,99,.14); border: 1px solid rgba(235,99,99,.5); color: #ffb4b4; }
  .banner.warn { background: rgba(240,200,96,.12); border: 1px solid rgba(240,200,96,.45); color: #ffe2a0; }

  .readout { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .metric { background: var(--panel-2); border-radius: 10px; padding: 12px; }
  .metric .k { font-size: 12px; color: var(--muted); }
  .metric .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  .conf-track { height: 8px; border-radius: 4px; background: #0c1117; margin-top: 8px; overflow: hidden; }
  .conf-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--good)); transition: width .15s; }

  .canvas-wrap { width: 100%; overflow-x: auto; }
  canvas#fretboard { width: 100%; height: 260px; display: block; min-width: 720px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .dot.idle { background: rgba(120,130,150,.5); }
  .dot.detected { background: var(--accent); }
  .dot.correct { background: var(--good); }
  .dot.error { background: var(--bad); }

  .demo-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 12px; }
  #targetPanel { margin-top: 12px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  #statusText { color: var(--muted); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>🎸 Fretsense</h1>
  <p>弹响一根弦，实时告诉你是哪根弦、第几品 —— 全部计算在本地完成，音频不上传。</p>
</header>

<main>
  <section class="panel" aria-label="控制面板">
    <div class="controls">
      <div class="field">
        <label for="startStop">采集开关</label>
        <button id="startStop" type="button">▶ 开始</button>
      </div>
      <div class="field">
        <label for="sourceSelect">信号源</label>
        <select id="sourceSelect">
          <option value="mic">麦克风</option>
          <option value="synth">本地合成信号（免麦克风验收）</option>
        </select>
      </div>
      <div class="field">
        <label for="tuningSelect">调弦</label>
        <select id="tuningSelect"></select>
      </div>
      <div class="field">
        <label for="modeSelect">模式</label>
        <select id="modeSelect">
          <option value="free">自由听音（检测到即点亮）</option>
          <option value="target">目标音练习（判定正确/错误）</option>
        </select>
      </div>
    </div>

    <div id="targetPanel" hidden>
      <div class="field">
        <label for="targetNote">目标音名</label>
        <select id="targetNote">
          <option>C</option><option>C#</option><option>D</option><option>D#</option>
          <option selected>E</option><option>F</option><option>F#</option><option>G</option>
          <option>G#</option><option>A</option><option>A#</option><option>B</option>
        </select>
      </div>
      <div class="field">
        <label for="targetOctave">八度</label>
        <select id="targetOctave">
          <option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option>
        </select>
      </div>
    </div>

    <div class="demo-row">
      <div class="field">
        <label for="demoFreq">合成基频 (Hz)</label>
        <select id="demoFreq">
          <option value="82.41">82.41 — E2（6 弦空弦）</option>
          <option value="110" selected>110.00 — A2（5 弦空弦）</option>
          <option value="146.83">146.83 — D3（4 弦空弦）</option>
          <option value="196">196.00 — G3（3 弦空弦）</option>
          <option value="246.94">246.94 — B3（2 弦空弦）</option>
          <option value="329.63">329.63 — E4（1 弦空弦）</option>
        </select>
      </div>
      <div class="field">
        <label for="demoHarmonics">谐波构成</label>
        <select id="demoHarmonics">
          <option value="pure" data-hint="纯正弦，只有基频">纯正弦</option>
          <option value="strong2nd" data-hint="二次谐波比基频强 50%，用于验证不会误判高八度" selected>强二次谐波</option>
          <option value="guitarish" data-hint="基频加 4 个递减谐波，接近真实拨弦">类吉他谐波栈</option>
        </select>
      </div>
      <span class="hint" id="harmonicsHint">二次谐波比基频强 50%，用于验证不会误判高八度</span>
    </div>

    <div id="banner" class="banner hidden" role="alert"></div>
    <div id="statusText">待机：选择信号源后点“开始”。</div>
  </section>

  <section class="panel" aria-label="检测结果">
    <div class="readout">
      <div class="metric"><div class="k">当前音名</div><div class="v" id="noteName">—</div></div>
      <div class="metric"><div class="k">频率</div><div class="v" id="frequency">— Hz</div></div>
      <div class="metric"><div class="k">弦 / 品</div><div class="v" id="stringFret">— 弦 / — 品</div></div>
      <div class="metric">
        <div class="k">置信度</div>
        <div class="v" id="confidence">0%</div>
        <div class="conf-track"><div class="conf-fill" id="confidenceBar"></div></div>
      </div>
    </div>
  </section>

  <section class="panel" aria-label="指板">
    <div class="canvas-wrap">
      <canvas id="fretboard" width="1000" height="260" role="img"
              aria-label="吉他指板：横向为六根弦，纵向为品丝，点亮处为检测到的弦品位置"></canvas>
    </div>
    <div class="legend">
      <span><span class="dot idle"></span>待机</span>
      <span><span class="dot detected"></span>检测到</span>
      <span><span class="dot correct"></span>正确（目标音练习）</span>
      <span><span class="dot error"></span>错误（目标音练习）</span>
    </div>
  </section>
</main>

<script type="module">
  import { FretsenseApp } from './src/app.js';
  new FretsenseApp();
</script>
</body>
</html>
