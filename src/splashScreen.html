<div id="splashScreen">
	<div>
		<div></div>
		<b>{{GSDAW-VERSION}}</b>
		<span data-alert="firefox">
			<span>Sadly, GridSound is not ready yet for Firefox</span>
			<gsui-icon icon="br-firefox"></i>
		</span>
		<button id="splashScreen-start" disabled></button>
		<ul id="splashScreen-steps">
			<li data-step="audio">audio context</li>
			<li data-step="samples">sample library</li>
			<li data-step="wavelets">wavetable library</li>
			<li data-step="ui">user interface</li>
		</ul>
		<span id="splashScreen-status"></span>
		<div id="splashScreen-error">
			<span id="splashScreen-errorMsg"></span>
			<button id="splashScreen-retry">[ retry ]</button>
		</div>
		<span id="splashScreen-swWarning"></span>
		<a
			href="//github.com/gridsound/daw/wiki/2.59.0"
			target="_blank"
			style="text-decoration: underline; opacity: .6;"
		>a message related to the new version</a>
	</div>
</div>
