<div id="splashScreen" data-state="idle" data-phase="resume">
	<div>
		<div></div>
		<b>{{GSDAW-VERSION}}</b>
		<span data-alert="firefox">
			<span>Sadly, GridSound is not ready yet for Firefox</span>
			<gsui-icon icon="br-firefox"></i>
		</span>
		<button disabled></button>
		<div data-error hidden>
			<p>
				<span>Start failed at</span>
				<strong data-error-phase></strong>
			</p>
			<p data-error-msg></p>
			<button data-retry type="button">Retry</button>
		</div>
		<a
			href="//github.com/gridsound/daw/wiki/2.59.0"
			target="_blank"
			style="text-decoration: underline; opacity: .6;"
		>a message related to the new version</a>
	</div>
</div>
