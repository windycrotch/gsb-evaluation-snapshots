<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>please just text me</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #111111; --muted: #8e8e93; --bubble: #0b84fe; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f2f2f7; } }
      body {
        margin: 0; min-height: 100svh; display: grid; place-items: center;
        background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, Roboto, sans-serif; text-align: center; padding: 16px;
      }
      .bubble {
        display: inline-block; background: var(--bubble); color: #fff;
        font-size: clamp(22px, 6vw, 40px); padding: 0.45em 0.9em; border-radius: 1.1em;
      }
      .typing { margin-top: 20px; color: var(--muted); font-size: 18px; }
      .typing span { animation: blink 1.4s infinite both; }
      .typing span:nth-child(2) { animation-delay: 0.2s; }
      .typing span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    </style>
  </head>
  <body>
    <main>
      <div class="bubble">please just text me.</div>
      <p class="typing">coming soon<span>.</span><span>.</span><span>.</span></p>
    </main>
  </body>
</html>
