name: Bug report
description: Report a reproducible problem in Bytebound: Meadow Run.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Please avoid including secrets or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
      placeholder: The touch jump button remains pressed after...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that consistently shows the problem.
      placeholder: |
        1. Open the game on...
        2. Start Stage...
        3. Tap...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop browser
        - Mobile browser
        - Installed mobile web app
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Safari 18, Firefox 142
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: Attach screenshots or a short recording if they help demonstrate the issue.
