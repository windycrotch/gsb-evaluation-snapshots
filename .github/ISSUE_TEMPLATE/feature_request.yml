name: Feature request
description: Suggest a focused AeroFlap improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Propose a specific change and explain the player or maintainer benefit.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the requested behavior, scope, and any input or accessibility considerations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain other approaches, if any.
