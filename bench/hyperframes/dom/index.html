<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="gsap.min.js"></script><script src="shared.js"></script>
<style>* { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }</style>
</head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
  <div id="scene" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
</div>
<script>
  // The same scene as HTML elements, each moved from the timeline's time.
  const els = BENCH.dom(document.getElementById('scene'));
  const tl = gsap.timeline({ paused: true });
  tl.to({}, { duration: 10, ease: 'none', onUpdate: () => BENCH.applyDom(els, tl.time()) }, 0);
  window.__timelines["main"] = tl;
  tl.seek(0); BENCH.applyDom(els, 0);
</script>
</body></html>
